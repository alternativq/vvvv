<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер тренировок — Турник и свой вес</title>
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключение шрифта Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        accent: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Плавные переходы и кастомные детали скроллбара */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Скрытие полосы прокрутки у горизонтального списка дней на мобильных */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Анимация вспышки таймера при завершении */
        @keyframes timerFinishPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.015); }
        }
        .timer-finished {
            animation: timerFinishPulse 0.6s ease-in-out 3;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200 min-h-screen pb-36 sm:pb-32">

    <!-- Уведомление (Toast) вместо alert() -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col items-center gap-2 w-full max-w-sm px-4"></div>

    <!-- Модальное окно подтверждения сброса (вместо confirm()) -->
    <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-xl">
            <h3 id="modal-title" class="text-lg font-semibold text-slate-900 dark:text-white mb-2">Подтвердите действие</h3>
            <p id="modal-desc" class="text-sm text-slate-600 dark:text-slate-400 mb-6">Вы уверены, что хотите сбросить отметки?</p>
            <div class="flex justify-end gap-3">
                <button id="modal-cancel" class="px-4 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    Отмена
                </button>
                <button id="modal-confirm" class="px-4 py-2.5 rounded-xl text-sm font-medium bg-slate-900 text-white dark:bg-emerald-600 dark:hover:bg-emerald-500 hover:bg-slate-800 transition">
                    Подтвердить
                </button>
            </div>
        </div>
    </div>

    <!-- Основной контейнер -->
    <div class="max-w-3xl mx-auto px-4 pt-5 sm:pt-8">

        <!-- Шапка приложения -->
        <header class="flex items-center justify-between gap-4 mb-6">
            <div>
                <div class="flex items-center gap-2">
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-600 dark:bg-emerald-500"></span>
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Калистеника • 4 дня</span>
                </div>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900 dark:text-white mt-0.5">
                    План тренировок
                </h1>
            </div>

            <!-- Переключатели настроек (Автотаймер, Звук, Тема) -->
            <div class="flex items-center gap-1.5 sm:gap-2">
                <!-- Автозапуск таймера при отметке подхода -->
                <button id="toggle-autostart" title="Автозапуск таймера при отметке подхода"
                    class="flex items-center gap-1.5 px-2.5 py-2 rounded-xl text-xs font-medium border transition">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m6-2a10 10 0 11-20 0 10 10 0 0120 0z"/>
                    </svg>
                    <span class="hidden sm:inline">Авто-таймер</span>
                </button>

                <!-- Звук таймера -->
                <button id="toggle-sound" title="Звуковой сигнал таймера"
                    class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <!-- Иконка обновляется через JS -->
                </button>

                <!-- Переключатель темной/светлой темы -->
                <button id="toggle-theme" title="Сменить тему оформления"
                    class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <svg id="theme-icon-dark" class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                    </svg>
                    <svg id="theme-icon-light" class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Вкладки выбора тренировочного дня (4 дня) -->
        <nav aria-label="Выбор дня тренировки" class="mb-6">
            <div id="day-tabs" class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                <!-- Генерируется через JavaScript -->
            </div>
        </nav>

        <!-- Заголовок активного дня и общий прогресс -->
        <section class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-4 sm:p-5 mb-5 shadow-2xs">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
                <div>
                    <div class="flex items-center gap-2 flex-wrap">
                        <h2 id="active-day-title" class="text-lg font-bold text-slate-900 dark:text-white"></h2>
                        <span id="active-day-badge" class="hidden inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800/60">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                            </svg>
                            Выполнено
                        </span>
                    </div>
                    <p id="active-day-subtitle" class="text-sm text-slate-500 dark:text-slate-400 mt-0.5"></p>
                </div>
                <div class="flex items-center justify-between sm:justify-end gap-4">
                    <div class="text-left sm:text-right">
                        <span id="day-sets-counter" class="text-sm font-semibold text-slate-800 dark:text-slate-200">0 / 0 подходов</span>
                        <span id="day-percent" class="text-xs text-slate-400 dark:text-slate-500 block">0% завершено</span>
                    </div>
                </div>
            </div>
            <!-- Полоса прогресса -->
            <div class="w-full h-2 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                <div id="day-progress-bar" class="h-full bg-emerald-600 dark:bg-emerald-500 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </section>

        <!-- Список упражнений выбранного дня -->
        <main id="exercises-list" class="space-y-3.5 mb-6">
            <!-- Карточки упражнений генерируются через JavaScript -->
        </main>

        <!-- Панель действий внизу дня (Завершить / Сбросить) -->
        <section class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mb-8">
            <button id="btn-finish-workout"
                class="flex-1 flex items-center justify-center gap-2 px-5 py-3.5 rounded-2xl font-semibold text-sm bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white shadow-xs transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                </svg>
                Завершить тренировку
            </button>
            <button id="btn-reset-day"
                class="flex items-center justify-center gap-2 px-4 py-3.5 rounded-2xl font-medium text-sm bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
                Сбросить подходы дня
            </button>
        </section>

        <!-- Журнал завершённых тренировок -->
        <section class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-4 sm:p-5">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-200">История тренировок</h3>
                </div>
                <button id="btn-clear-history" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition hidden">
                    Очистить
                </button>
            </div>
            <div id="history-list" class="space-y-2">
                <!-- Элементы истории генерируются через JS -->
            </div>
        </section>

    </div>

    <!-- Фиксированная панель таймера отдыха внизу экрана -->
    <div id="timer-bar" class="fixed bottom-0 inset-x-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 shadow-lg transition-colors">
        <!-- Тонкий прогресс-бар таймера по верхнему краю -->
        <div class="w-full h-1 bg-slate-100 dark:bg-slate-800">
            <div id="timer-progress-bar" class="h-full bg-emerald-600 dark:bg-emerald-500 transition-all duration-300" style="width: 100%"></div>
        </div>

        <div class="max-w-3xl mx-auto px-4 py-2.5 sm:py-3">
            <div class="flex flex-wrap items-center justify-between gap-2 sm:gap-4">
                
                <!-- Левая часть: Циферблат и кнопки +/- 15 сек -->
                <div class="flex items-center gap-2 sm:gap-3">
                    <button id="timer-minus" title="Уменьшить на 15 сек"
                        class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-semibold flex items-center justify-center transition">
                        -15
                    </button>

                    <div class="text-center min-w-[78px]">
                        <div id="timer-display" class="text-2xl sm:text-3xl font-bold tabular-nums tracking-tight text-slate-900 dark:text-white leading-none">
                            01:30
                        </div>
                        <span id="timer-label" class="text-[11px] font-medium text-slate-400 dark:text-slate-500 block mt-0.5 truncate max-w-[110px]">
                            Отдых
                        </span>
                    </div>

                    <button id="timer-plus" title="Добавить 15 сек"
                        class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-semibold flex items-center justify-center transition">
                        +15
                    </button>
                </div>

                <!-- Центральная часть: Быстрые пресеты (скрываются на самых узких экранах в пользу компактности, доступны со sm или компактным рядом) -->
                <div class="hidden md:flex items-center gap-1.5">
                    <button data-preset="45" class="timer-preset px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">45с</button>
                    <button data-preset="60" class="timer-preset px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">60с</button>
                    <button data-preset="90" class="timer-preset px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">90с</button>
                    <button data-preset="120" class="timer-preset px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">120с</button>
                    <button data-preset="150" class="timer-preset px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">150с</button>
                </div>

                <!-- Правая часть: Старт/Пауза и Сброс -->
                <div class="flex items-center gap-2">
                    <button id="timer-toggle"
                        class="px-4 sm:px-5 py-2.5 rounded-xl text-sm font-semibold bg-slate-900 dark:bg-emerald-600 text-white hover:bg-slate-800 dark:hover:bg-emerald-500 transition flex items-center gap-1.5 min-w-[104px] justify-center">
                        <span id="timer-toggle-text">Старт</span>
                    </button>
                    <button id="timer-reset" title="Сбросить таймер"
                        class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Быстрые пресеты для мобильных и планшетов -->
            <div class="flex md:hidden items-center justify-between gap-1.5 mt-2 pt-2 border-t border-slate-100 dark:border-slate-800/80">
                <span class="text-[11px] text-slate-400 dark:text-slate-500 mr-1">Пресеты:</span>
                <div class="flex items-center gap-1.5 flex-1 justify-end">
                    <button data-preset="45" class="timer-preset flex-1 py-1 rounded-lg text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 active:bg-slate-200 transition">45с</button>
                    <button data-preset="60" class="timer-preset flex-1 py-1 rounded-lg text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 active:bg-slate-200 transition">60с</button>
                    <button data-preset="90" class="timer-preset flex-1 py-1 rounded-lg text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 active:bg-slate-200 transition">90с</button>
                    <button data-preset="120" class="timer-preset flex-1 py-1 rounded-lg text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 active:bg-slate-200 transition">120с</button>
                    <button data-preset="150" class="timer-preset flex-1 py-1 rounded-lg text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 active:bg-slate-200 transition">150с</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * База данных программы тренировок (4 дня, турник + собственный вес)
         */
        const WORKOUT_PLAN = [
            {
                id: 'day1',
                shortTitle: 'День 1',
                focus: 'Верх • Сила',
                title: 'День 1 — Верх (Сила и сложные рычаги)',
                subtitle: 'Акцент на силу тяги, вертикальный жим и контроль негативной фазы.',
                exercises: [
                    {
                        id: 'd1_e1',
                        name: 'Подтягивания лучника (или с паузой 2 сек. в верхней точке)',
                        sets: 4,
                        reps: '6–10 повт.',
                        restSec: 150,
                        restLabel: '150 сек (2.5 мин)',
                        tip: 'Одна рука активно тянет корпус к кисти, вторая выпрямлена в сторону и лишь стабилизирует движение. Если пока тяжело — делайте обычные подтягивания с чёткой паузой 2 секунды, когда подбородок выше перекладины.'
                    },
                    {
                        id: 'd1_e2',
                        name: 'Отжимания «щучкой» (ноги на возвышении, акцент на плечи)',
                        sets: 4,
                        reps: '8–12 повт.',
                        restSec: 120,
                        restLabel: '120 сек (2 мин)',
                        tip: 'Поставьте стопы на диван или стул, таз поднимите максимально высоко, чтобы корпус был почти вертикально. Опускайтесь макушкой вперёд перед линией ладоней, локти не разводите слишком широко.'
                    },
                    {
                        id: 'd1_e3',
                        name: 'Подтягивания узким обратным хватом (медленный спуск 3–4 сек.)',
                        sets: 3,
                        reps: '8–10 повт.',
                        restSec: 90,
                        restLabel: '90 сек',
                        tip: 'Мощно подтянитесь вверх до касания перекладины верхом груди, а затем плавно опускайтесь на 3–4 счёта до полного выпрямления рук без рывка в нижней точке.'
                    },
                    {
                        id: 'd1_e4',
                        name: 'Отжимания с узкой постановкой рук (трицепс)',
                        sets: 3,
                        reps: '12–15 повт.',
                        restSec: 90,
                        restLabel: '90 сек',
                        tip: 'Ладони поставьте чуть уже ширины плеч. Локти во время движения скользят строго вдоль корпуса назад, пресс и ягодицы напряжены.'
                    }
                ]
            },
            {
                id: 'day2',
                shortTitle: 'День 2',
                focus: 'Низ и Кор',
                title: 'День 2 — Низ и Кор (Баланс и взрыв)',
                subtitle: 'Унилатеральная нагрузка на ноги и глубокая проработка пресса в висе.',
                exercises: [
                    {
                        id: 'd2_e1',
                        name: 'Болгарские сплит-приседания (задняя нога на диване/стуле)',
                        sets: 4,
                        reps: '10–12 на ногу',
                        restSec: 90,
                        restLabel: '90 сек',
                        tip: 'Основной вес (около 80–85%) держите на передней ноге. Опускайтесь глубоко вниз, слегка наклонив корпус вперёд для лучшего включения ягодиц и квадрицепса.'
                    },
                    {
                        id: 'd2_e2',
                        name: 'Подъём прямых ног к перекладине в висе',
                        sets: 4,
                        reps: '10–15 повт.',
                        restSec: 90,
                        restLabel: '90 сек',
                        tip: 'Избегайте раскачки. Начинайте движение с подкручивания таза вверх, а не просто сгибания в тазобедренном суставе. Опускайте ноги подконтрольно.'
                    },
                    {
                        id: 'd2_e3',
                        name: 'Выпады назад с паузой в нижней точке',
                        sets: 3,
                        reps: '12 на ногу',
                        restSec: 75,
                        restLabel: '75 сек',
                        tip: 'Сделайте шаг назад, опустите колено почти до касания пола, зафиксируйте положение на 1–2 секунды без расслабления мышц и вернитесь в исходную стойку.'
                    },
                    {
                        id: 'd2_e4',
                        name: 'Ягодичный мостик на одной ноге',
                        sets: 3,
                        reps: '15 на ногу',
                        restSec: 60,
                        restLabel: '60 сек',
                        tip: 'Лёжа на спине, упритесь пяткой опорной ноги в пол, вторую ногу вытяните вверх. В верхней точке сильно сожмите ягодицу на 1 секунду, не прогибаясь в пояснице.'
                    },
                    {
                        id: 'd2_e5',

        // Инициализация состояния из localStorage
        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    state = {
                        ...state,
                        ...parsed,
                        settings: {
                            ...state.settings,
                            ...(parsed.settings || {})
                        }
                    };
                } else {
                    // Определяем системную тему при первом запуске
                    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        state.settings.darkMode = true;
                    }
                }
            } catch (e) {
                console.error('Ошибка чтения localStorage:', e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.error('Ошибка записи в localStorage:', e);
            }
        }

        /**
         * Звуковой сигнал окончания отдыха через Web Audio API (без внешних файлов)
         */
        function playTimerChime() {
            if (!state.settings.soundEnabled) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();

                const playBeep = (freq, startTime, duration) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, startTime);

                    gain.gain.setValueAtTime(0.001, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.22, startTime + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(startTime);
                    osc.stop(startTime + duration);
                };

                const now = ctx.currentTime;
                playBeep(587.33, now, 0.22);        // D5
                playBeep(880.00, now + 0.24, 0.35); // A5
            } catch (e) {
                console.warn('Не удалось воспроизвести звук:', e);
            }
        }

        /**
         * Показ аккуратного всплывающего уведомления
         */
        function showToast(message, type = 'neutral') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success'
                ? 'bg-emerald-700 text-white border-emerald-600'
                : 'bg-slate-800 dark:bg-slate-800 text-white border-slate-700';

            toast.className = `px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium shadow-lg border ${bgClass} transition-all duration-300 opacity-0 translate-y-[-8px]`;
            toast.textContent = message;

            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('opacity-0', 'translate-y-[-8px]');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-8px]');
                setTimeout(() => toast.remove(), 300);
            }, 2600);
        }

        /**
         * Подсчёт статистики подходов для конкретного дня
         */
        function getDayStats(day) {
            let totalSets = 0;
            let doneSets = 0;

            day.exercises.forEach(ex => {
                totalSets += ex.sets;
                const arr = state.completedSets[ex.id] || [];
                for (let i = 0; i < ex.sets; i++) {
                    if (arr[i]) doneSets++;
                }
            });

            const percent = totalSets > 0 ? Math.round((doneSets / totalSets) * 100) : 0;
            return { totalSets, doneSets, percent };
        }

            }

            clearBtn.classList.remove('hidden');
            listEl.innerHTML = state.history.slice(0, 12).map(item => `
                <div class="flex items-center justify-between gap-3 py-2 px-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800/80 text-xs">
                    <div class="flex items-center gap-2 min-w-0">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
                        <span class="font-medium text-slate-800 dark:text-slate-200 truncate">${item.dayTitle}</span>
                    </div>
                    <div class="flex items-center gap-3 shrink-0 text-slate-500 dark:text-slate-400">
                        <span>${item.setsCount} подх.</span>
                        <span>${item.dateStr}</span>
                    </div>
                </div>
            `).join('');
        }

        /**
         * Логика таймера отдыха
         */
        function formatSeconds(sec) {
            const clamped = Math.max(0, Math.floor(sec));
            const m = Math.floor(clamped / 60);
            const s = clamped % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updateTimerUI() {
            document.getElementById('timer-display').textContent = formatSeconds(timerState.remaining);
            document.getElementById('timer-label').textContent = timerState.label || 'Отдых';

            const toggleBtn = document.getElementById('timer-toggle');
            const toggleText = document.getElementById('timer-toggle-text');

            if (timerState.isRunning) {
                toggleText.textContent = 'Пауза';
                toggleBtn.className = 'px-4 sm:px-5 py-2.5 rounded-xl text-sm font-semibold bg-amber-600 hover:bg-amber-700 text-white transition flex items-center gap-1.5 min-w-[104px] justify-center';
            } else {
                toggleText.textContent = 'Старт';
                toggleBtn.className = 'px-4 sm:px-5 py-2.5 rounded-xl text-sm font-semibold bg-slate-900 dark:bg-emerald-600 text-white hover:bg-slate-800 dark:hover:bg-emerald-500 transition flex items-center gap-1.5 min-w-[104px] justify-center';
            }

            const pct = timerState.duration > 0 ? Math.min(100, Math.max(0, (timerState.remaining / timerState.duration) * 100)) : 0;
            document.getElementById('timer-progress-bar').style.width = `${pct}%`;
        }

        function stopTimerInterval() {
            if (timerState.intervalId) {
                clearInterval(timerState.intervalId);
                timerState.intervalId = null;
            }
            timerState.isRunning = false;
        }

        function startRestTimer(seconds, label = 'Отдых', autoRun = true) {
            stopTimerInterval();
            timerState.duration = seconds;
            timerState.remaining = seconds;
            // Сокращаем название упражнения для компактного отображения под таймером
            timerState.label = label.split('(')[0].trim();

            const timerBar = document.getElementById('timer-bar');
            timerBar.classList.remove('timer-finished');

            if (autoRun) {
                resumeTimer();
            } else {
                updateTimerUI();
            }
        }

        function resumeTimer() {
            if (timerState.isRunning) return;
            if (timerState.remaining <= 0) {
                timerState.remaining = timerState.duration;
            }

            timerState.isRunning = true;
            updateTimerUI();

            timerState.intervalId = setInterval(() => {
                timerState.remaining -= 1;
                if (timerState.remaining <= 0) {
                    timerState.remaining = 0;
                    stopTimerInterval();
                    updateTimerUI();
                    playTimerChime();
                    const timerBar = document.getElementById('timer-bar');
                    timerBar.classList.remove('timer-finished');
                    void timerBar.offsetWidth; // перезапуск анимации
                    timerBar.classList.add('timer-finished');
                    showToast('Время отдыха вышло — пора к следующему подходу!', 'success');
                } else {
                    updateTimerUI();
                }
            }, 1000);
        }

        function renderAll() {
            applyThemeAndSettings();
            renderDayTabs();
            renderActiveDay();
            renderHistory();
            updateTimerUI();
        }

        /**
         * Привязка глобальных обработчиков событий
         */
        function bindEvents() {
            // Переключение темы
            document.getElementById('toggle-theme').addEventListener('click', () => {
                state.settings.darkMode = !state.settings.darkMode;
                saveState();
                applyThemeAndSettings();
            });

            // Переключение автозапуска таймера
            document.getElementById('toggle-autostart').addEventListener('click', () => {
                state.settings.autoStartTimer = !state.settings.autoStartTimer;
                saveState();
                applyThemeAndSettings();
                showToast(state.settings.autoStartTimer
                    ? 'Автозапуск таймера при отметке подхода включён'
                    : 'Автозапуск таймера отключён');
            });

            // Переключение звука
            document.getElementById('toggle-sound').addEventListener('click', () => {
                state.settings.soundEnabled = !state.settings.soundEnabled;
                saveState();
                applyThemeAndSettings();
                showToast(state.settings.soundEnabled ? 'Звук таймера включён' : 'Звук таймера выключен');
            });

            // Кнопка Старт / Пауза таймера
            document.getElementById('timer-toggle').addEventListener('click', () => {
                if (timerState.isRunning) {
                    stopTimerInterval();
                    updateTimerUI();
                } else {
                    resumeTimer();
                }
            });

            // Кнопка Сброса таймера
            document.getElementById('timer-reset').addEventListener('click', () => {
                stopTimerInterval();
                timerState.remaining = timerState.duration;
                updateTimerUI();
            });

            // Кнопки -15с и +15с
            document.getElementById('timer-minus').addEventListener('click', () => {
                timerState.remaining = Math.max(5, timerState.remaining - 15);
                if (timerState.remaining > timerState.duration) {
                    timerState.duration = timerState.remaining;
                }
                updateTimerUI();
            });

            document.getElementById('timer-plus').addEventListener('click', () => {
                timerState.remaining += 15;
                if (timerState.remaining > timerState.duration) {
                    timerState.duration = timerState.remaining;
                }
                updateTimerUI();
            });

            // Быстрые пресеты таймера
            document.querySelectorAll('.timer-preset').forEach(btn => {
                btn.addEventListener('click', () => {
                    const sec = parseInt(btn.dataset.preset, 10);
                    startRestTimer(sec, `Отдых (${sec} сек)`, true);
                });
            });

            // Завершить тренировку
            document.getElementById('btn-finish-workout').addEventListener('click', () => {
                const day = WORKOUT_PLAN.find(d => d.id === state.activeDayId) || WORKOUT_PLAN[0];
                const stats = getDayStats(day);

                if (stats.doneSets === 0) {
                    showToast('Отметьте хотя бы один выполненный подход перед завершением.');
                    return;
                }

                const now = new Date();
                const dateStr = now.toLocaleDateString('ru-RU', {
                    day: '2-digit',
                    month: 'short',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                state.completedDays[day.id] = true;
                state.history.unshift({
                    id: Date.now(),
                    dayId: day.id,
                    dayTitle: `${day.shortTitle}: ${day.focus}`,
                    dateStr,
                    setsCount: `${stats.doneSets}/${stats.totalSets}`
                });

                saveState();
                renderDayTabs();
                renderHistory();
                showToast(`Тренировка «${day.shortTitle}» записана в историю!`, 'success');
            });

            // Сбросить подходы текущего дня
            document.getElementById('btn-reset-day').addEventListener('click', () => {
                const day = WORKOUT_PLAN.find(d => d.id === state.activeDayId) || WORKOUT_PLAN[0];
                showConfirmModal(
                    `Сбросить ${day.shortTitle}?`,
                    'Все отметки подходов для этого дня будут очищены, чтобы вы могли начать новый цикл.',
                    () => {
                        day.exercises.forEach(ex => {
                            delete state.completedSets[ex.id];
                        });
                        delete state.completedDays[day.id];
                        saveState();
                        renderDayTabs();
                        renderActiveDay();
                        showToast(`Отметки для «${day.shortTitle}» сброшены`);
                    }
                );
            });

            // Очистить историю тренировок
            document.getElementById('btn-clear-history').addEventListener('click', () => {
                showConfirmModal(
                    'Очистить историю?',
                    'Все записи о завершённых тренировках будут удалены.',
                    () => {
                        state.history = [];
                        saveState();
                        renderHistory();
                        showToast('История тренировок очищена');
                    }
                );
            });
        }

        // Запуск приложения после загрузки DOM
        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            bindEvents();
            renderAll();
        });
    </script>
</body>
</html>
