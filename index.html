<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Трекер тренировок — Турник и свой вес</title>

    <!-- PWA и iOS Safari мета-теги для добавления на экран «Домой» -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Тренировки">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">

    <!-- Минималистичная иконка турника для рабочего стола iPhone (SVG) -->
    <link rel="apple-touch-icon" id="ios-app-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='42' fill='%23101216'/%3E%3Cpath d='M36 142V58a14 14 0 0 1 14-14h80a14 14 0 0 1 14 14v84' fill='none' stroke='%232563EB' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='26' y1='58' x2='154' y2='58' stroke='%23F3F4F6' stroke-width='12' stroke-linecap='round'/%3E%3Ccircle cx='90' cy='88' r='11' fill='%2310B981'/%3E%3Cpath d='M68 62l12 36h20l12-36M82 98l-4 34M98 98l4 34' fill='none' stroke='%23F3F4F6' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='42' fill='%23101216'/%3E%3Cline x1='26' y1='58' x2='154' y2='58' stroke='%2310B981' stroke-width='14' stroke-linecap='round'/%3E%3Cpath d='M42 58v84M138 58v84' stroke='%23F3F4F6' stroke-width='12' stroke-linecap='round'/%3E%3C/svg%3E">

    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключение шрифта Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Дизайн-токены в стиле Apple Health / Linear (без кислотных/неоновых эффектов) */
        :root {
            --bg-canvas: #F5F6F8;
            --bg-card: #FFFFFF;
            --bg-subtle: #ECEEF2;
            --bg-pill: #F3F4F6;
            --border-subtle: #E5E7EB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --accent-blue: #2563EB;
            --accent-blue-hover: #1D4ED8;
            --accent-blue-soft: rgba(37, 99, 235, 0.10);
            --accent-emerald: #10B981;
            --accent-emerald-soft: rgba(16, 185, 129, 0.12);
            --card-shadow: 0 1px 3px rgba(17, 24, 39, 0.04), 0 1px 2px rgba(17, 24, 39, 0.02);
            --dock-bg: rgba(255, 255, 255, 0.84);
            --dock-border: rgba(229, 231, 235, 0.92);
            --dock-shadow: 0 14px 34px -6px rgba(17, 24, 39, 0.14), 0 4px 12px -2px rgba(17, 24, 39, 0.06);
        }

        html.dark {
            --bg-canvas: #101216;
            --bg-card: #191C22;
            --bg-subtle: #14171D;
            --bg-pill: #222630;
            --border-subtle: #272B36;
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --accent-blue: #2563EB;
            --accent-blue-hover: #3B82F6;
            --accent-blue-soft: rgba(37, 99, 235, 0.18);
            --accent-emerald: #10B981;
            --accent-emerald-soft: rgba(16, 185, 129, 0.16);
            --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
            --dock-bg: rgba(25, 28, 34, 0.84);
            --dock-border: rgba(55, 62, 77, 0.72);
            --dock-shadow: 0 18px 40px -6px rgba(0, 0, 0, 0.58), 0 6px 16px -3px rgba(0, 0, 0, 0.36);
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            transition: background-color 0.22s ease, color 0.22s ease;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Основной контейнер с безопасными отступами для выреза iPhone и нижнего парящего таймера */
        .app-shell {
            max-width: 640px;
            margin: 0 auto;
            padding-left: 16px;
            padding-right: 16px;
            padding-top: calc(16px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(200px + env(safe-area-inset-bottom, 0px));
        }

        /* Карточки и поверхности */
        .surface-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--card-shadow);
            transition: background-color 0.22s ease, border-color 0.22s ease;
        }

        .segmented-container {
            background-color: var(--bg-subtle);
            border: 1px solid var(--border-subtle);
            padding: 4px;
            border-radius: 18px;
        }

        .text-primary { color: var(--text-primary); }
        .text-secondary { color: var(--text-secondary); }

        /* Тактильные кнопки подходов (минимум 44px по высоте, скругление 14px) */
        .set-btn {
            min-height: 44px;
            border-radius: 14px;
            transition: transform 0.14s cubic-bezier(0.2, 0, 0, 1), background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease;
            touch-action: manipulation;
        }

        .set-btn:active {
            transform: scale(0.96);
        }

        .set-btn-idle {
            background-color: var(--bg-pill);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
        }

        .set-btn-idle:hover {
            border-color: #9CA3AF;
        }

        .set-btn-done {
            background-color: var(--accent-emerald);
            border: 1px solid var(--accent-emerald);
            color: #FFFFFF;
        }

        /* Плавная аккордеон-анимация подсказок по технике */
        .tip-accordion {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            transition: grid-template-rows 0.26s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.22s ease, margin-top 0.26s ease;
            margin-top: 0;
        }

        .tip-accordion.open {
            grid-template-rows: 1fr;
            opacity: 1;
            margin-top: 12px;
        }

        .tip-accordion-inner {
            overflow: hidden;
        }

        /* Парящий нижний док таймера отдыха */
        .floating-timer-dock {
            position: fixed;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            left: 16px;
            right: 16px;
            max-width: 560px;
            margin: 0 auto;
            border-radius: 24px;
            background: var(--dock-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--dock-border);
            box-shadow: var(--dock-shadow);
            overflow: hidden;
            z-index: 40;
            transition: background-color 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
        }

        /* Моноширинные цифры таймера без дрожания */
        .timer-digits {
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }

        /* Мягкая пульсация при завершении отдыха */
        @keyframes dockFinishPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.015); }
        }

        .dock-finished {
            animation: dockFinishPulse 0.55s ease-in-out 2;
        }

        .toast-safe-top {
            top: calc(16px + env(safe-area-inset-top, 0px));
        }

        .tactile-btn {
            transition: transform 0.14s cubic-bezier(0.2, 0, 0, 1), background-color 0.16s ease, opacity 0.16s ease;
            touch-action: manipulation;
        }

        .tactile-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <!-- Всплывающие уведомления (Toast) вместо alert() -->
    <div id="toast-container" class="fixed toast-safe-top left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col items-center gap-2 w-full max-w-sm px-4"></div>

    <!-- Модальное окно подтверждения вместо confirm() -->
    <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 backdrop-blur-xs p-4">
        <div class="surface-card rounded-[24px] max-w-sm w-full p-6 shadow-2xl">
            <h3 id="modal-title" class="text-lg font-semibold text-primary mb-2">Подтвердите действие</h3>
            <p id="modal-desc" class="text-sm text-secondary leading-relaxed mb-6">Вы уверены, что хотите сбросить отметки?</p>
            <div class="flex justify-end gap-2.5">
                <button id="modal-cancel" type="button"
                    class="tactile-btn px-4 py-2.5 rounded-2xl text-sm font-medium text-secondary hover:opacity-80"
                    style="background-color: var(--bg-pill);">
                    Отмена
                </button>
                <button id="modal-confirm" type="button"
                    class="tactile-btn px-4 py-2.5 rounded-2xl text-sm font-semibold text-white"
                    style="background-color: var(--accent-blue);">
                    Подтвердить
                </button>
            </div>
        </div>
    </div>

    <!-- Основной контейнер страницы -->
    <div class="app-shell">

        <!-- Шапка приложения -->
        <header class="flex items-center justify-between gap-3 mb-5">
            <div>
                <div class="flex items-center gap-2">
                    <span class="inline-block w-2 h-2 rounded-full" style="background-color: var(--accent-emerald);"></span>
                    <span class="text-xs font-medium tracking-wide text-secondary">Турник • 4 дня в неделю</span>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-primary mt-0.5">
                    Тренировки
                </h1>
            </div>

            <!-- Компактные переключатели в шапке: Авто-таймер, Сброс дня, Тема -->
            <div class="flex items-center gap-2">
                <!-- Переключатель автозапуска таймера -->
                <button id="toggle-autostart" type="button" title="Автозапуск таймера отдыха при отметке подхода"
                    class="tactile-btn flex items-center gap-1.5 px-3 h-10 rounded-2xl text-xs font-semibold border transition">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m6-2a10 10 0 11-20 0 10 10 0 0120 0z"/>
                    </svg>
                    <span>Авто</span>
                </button>

                <!-- Кнопка сброса текущего дня -->
                <button id="btn-reset-day" type="button" title="Сбросить подходы текущего дня"
                    class="tactile-btn w-10 h-10 rounded-2xl surface-card flex items-center justify-center text-secondary hover:text-primary"
                    aria-label="Сбросить текущий день">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                </button>

                <!-- Переключатель светлой / тёмной темы -->
                <button id="toggle-theme" type="button" title="Сменить тему оформления"
                    class="tactile-btn w-10 h-10 rounded-2xl surface-card flex items-center justify-center text-secondary hover:text-primary"
                    aria-label="Сменить тему">
                    <svg id="theme-icon-dark" class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                    </svg>
                    <svg id="theme-icon-light" class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Сегментированные вкладки выбора дня (День 1 — День 4) -->
        <nav aria-label="Выбор тренировочного дня" class="mb-4">
            <div id="day-tabs" class="segmented-container grid grid-cols-4 gap-1">
                <!-- Генерируется через JavaScript -->
            </div>
        </nav>

        <!-- Карточка прогресса активного дня -->
        <section class="surface-card rounded-[20px] p-4 sm:p-5 mb-4">
            <div class="flex items-start justify-between gap-3 mb-3">
                <div>
                    <div class="flex items-center gap-2 flex-wrap">
                        <h2 id="active-day-title" class="text-base sm:text-lg font-bold text-primary leading-snug"></h2>
                        <span id="active-day-badge" class="hidden inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold"
                            style="background-color: var(--accent-emerald-soft); color: var(--accent-emerald);">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                            </svg>
                            Готово
                        </span>
                    </div>
                    <p id="active-day-subtitle" class="text-xs sm:text-sm text-secondary mt-1"></p>
                </div>
                <div class="text-right shrink-0">
                    <span id="day-sets-counter" class="text-sm font-bold text-primary timer-digits block">0 / 0</span>
                    <span id="day-percent" class="text-xs text-secondary timer-digits">0%</span>
                </div>
            </div>
            <!-- Полоса дневного прогресса -->
            <div class="w-full h-2 rounded-full overflow-hidden" style="background-color: var(--bg-pill);">
                <div id="day-progress-bar" class="h-full rounded-full transition-all duration-300" style="width: 0%; background-color: var(--accent-emerald);"></div>
            </div>
        </section>

        <!-- Список упражнений выбранного дня -->
        <main id="exercises-list" class="space-y-3.5 mb-6">
            <!-- Карточки упражнений генерируются через JavaScript -->
        </main>

        <!-- Кнопка фиксации завершённой тренировки -->
        <section class="mb-6">
            <button id="btn-finish-workout" type="button"
                class="tactile-btn w-full flex items-center justify-center gap-2 px-5 py-3.5 rounded-[18px] font-semibold text-sm text-white shadow-xs"
                style="background-color: var(--accent-emerald);">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                </svg>
                Завершить и записать тренировку
            </button>
        </section>

        <!-- История завершённых тренировок -->
        <section class="surface-card rounded-[20px] p-4 sm:p-5">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-secondary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <h3 class="text-sm font-semibold text-primary">История тренировок</h3>
                </div>
                <button id="btn-clear-history" type="button" class="text-xs text-secondary hover:text-primary transition hidden">
                    Очистить
                </button>
            </div>
            <div id="history-list" class="space-y-2">
                <!-- Записи истории генерируются через JS -->
            </div>
        </section>

    </div>

    <!-- Парящий док таймера отдыха (отстоит от низа и краёв экрана, со скруглением 24px) -->
    <aside id="timer-dock" class="floating-timer-dock" aria-label="Таймер отдыха">
        <!-- Тонкая полоса прогресса отдыха по верхнему краю карточки -->
        <div class="w-full h-[3px]" style="background-color: var(--bg-pill);">
            <div id="timer-progress-bar" class="h-full transition-all duration-300" style="width: 100%; background-color: var(--accent-blue);"></div>
        </div>

        <div class="px-4 pt-3 pb-3.5">
            <!-- Верхняя строка: название упражнения / статус Wake Lock / тест звука -->
            <div class="flex items-center justify-between gap-2 mb-2">
                <div class="flex items-center gap-2 min-w-0">
                    <span id="wakelock-badge" class="hidden inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium shrink-0"
                        style="background-color: var(--accent-emerald-soft); color: var(--accent-emerald);">
                        <span class="w-1.5 h-1.5 rounded-full animate-pulse" style="background-color: var(--accent-emerald);"></span>
                        Экран активен
                    </span>
                    <span id="timer-label" class="text-xs font-medium text-secondary truncate">
                        Отдых
                    </span>
                </div>

                <!-- Компактная кнопка проверки звука на iPhone -->
                <button id="btn-test-sound" type="button"
                    class="tactile-btn inline-flex items-center justify-center w-7 h-7 rounded-full text-xs transition shrink-0"
                    style="background-color: var(--bg-pill);"
                    title="Проверить звук сигнала"
                    aria-label="Проверить звук сигнала">
                    🔊
                </button>
            </div>

            <!-- Центральная строка: -15с | Циферблат | +15с и Старт / Сброс -->
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                    <button id="timer-minus" type="button" title="Уменьшить на 15 сек"
                        class="tactile-btn w-9 h-9 rounded-xl text-xs font-semibold text-primary flex items-center justify-center"
                        style="background-color: var(--bg-pill);">
                        −15
                    </button>

                    <div id="timer-display" class="timer-digits text-[28px] sm:text-[32px] font-bold tracking-tight text-primary leading-none min-w-[84px] text-center">
                        01:30
                    </div>

                    <button id="timer-plus" type="button" title="Добавить 15 сек"
                        class="tactile-btn w-9 h-9 rounded-xl text-xs font-semibold text-primary flex items-center justify-center"
                        style="background-color: var(--bg-pill);">
                        +15
                    </button>
                </div>

                <div class="flex items-center gap-2">
                    <button id="timer-toggle" type="button"
                        class="tactile-btn px-4 sm:px-5 h-10 rounded-2xl text-sm font-semibold text-white flex items-center justify-center min-w-[96px]"
                        style="background-color: var(--accent-blue);">
                        <span id="timer-toggle-text">Старт</span>
                    </button>

                    <button id="timer-reset" type="button" title="Сбросить таймер"
                        class="tactile-btn w-10 h-10 rounded-2xl flex items-center justify-center text-secondary hover:text-primary"
                        style="background-color: var(--bg-pill);"
                        aria-label="Сбросить таймер">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Нижняя строка: быстрые пресеты времени отдыха -->
            <div class="grid grid-cols-4 gap-1.5 mt-2.5 pt-2.5 border-t" style="border-color: var(--border-subtle);">
                <button type="button" data-preset="60" class="timer-preset tactile-btn py-1.5 rounded-xl text-xs font-medium text-secondary">60с</button>
                <button type="button" data-preset="90" class="timer-preset tactile-btn py-1.5 rounded-xl text-xs font-medium text-secondary">90с</button>
                <button type="button" data-preset="120" class="timer-preset tactile-btn py-1.5 rounded-xl text-xs font-medium text-secondary">120с</button>
                <button type="button" data-preset="150" class="timer-preset tactile-btn py-1.5 rounded-xl text-xs font-medium text-secondary">150с</button>
            </div>
        </div>
    </aside>

    <script>
        /**
         * Программа тренировок на 4 дня (домашний турник + собственный вес, база 15+ подтягиваний)
         */
        const WORKOUT_PLAN = [
            {
                id: 'day1',
                shortTitle: 'День 1',
                focus: 'Верх • Сила',
                title: 'День 1 — Верх (Сила и сложные рычаги)',
                subtitle: 'Акцент на силу тяги, вертикальный жим и подконтрольный спуск.',
                exercises: [
                    {
                        id: 'd1_e1',
                        name: 'Подтягивания лучника (или с паузой 2 сек. в верхней точке)',
                        sets: 4,

        const STORAGE_KEY = 'calisthenics_tracker_v2';

        /**
         * Состояние приложения (сохраняется в localStorage)
         */

            activeDayId: 'day1',
            completedSets: {},
            completedDays: {},
            openTips: {},
            history: [],
            settings: {
                darkMode: false,
                autoStartTimer: true

        /**
         * Состояние таймера отдыха (расчёт по целевой временной метке endTime)
         */
        let timerState = {
            duration: 90,
            remaining: 90,
            endTime: null,
            isRunning: false,
            intervalId: null,
            label: 'Отдых'
        };

        /**
         * Единый AudioContext для разблокировки звука в iOS Safari
         */
        let sharedAudioCtx = null;
        let isAudioUnlocked = false;

        /**
         * Объект Screen Wake Lock API (удержание экрана активным)
         */
        let wakeLockSentinel = null;

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('calisthenics_tracker_v1');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    state = {
                        ...state,
                        ...parsed,
                        settings: {
                            ...state.settings,
                            ...(parsed.settings || {})
                        }
                    };
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    state.settings.darkMode = true;
                }
            } catch (e) {
                console.error('Ошибка чтения localStorage:', e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.error('Ошибка сохранения в localStorage:', e);
            }
        }

        /**
         * Разблокировка Web Audio API при первом касании экрана на iPhone
         */
        function unlockIosAudio() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;

                if (!sharedAudioCtx) {
                    sharedAudioCtx = new AudioCtx();
                }

                if (sharedAudioCtx.state === 'suspended') {
                    sharedAudioCtx.resume();
                }

                if (!isAudioUnlocked) {
                    const buffer = sharedAudioCtx.createBuffer(1, 1, 22050);
                    const source = sharedAudioCtx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(sharedAudioCtx.destination);
                    if (source.start) {
                        source.start(0);
                    } else if (source.noteOn) {
                        source.noteOn(0);
                    }
                    isAudioUnlocked = true;
                }
            } catch (e) {
                console.warn('Ошибка разблокировки AudioContext:', e);
            }
        }

        ['touchstart', 'click'].forEach(evt => {
            document.addEventListener(evt, unlockIosAudio, { passive: true });
        });

        /**
         * Мягкий двухтональный сигнал окончания отдыха (880Hz -> 1174.66Hz)
         */
        function playTimerChime() {
            try {
                unlockIosAudio();
                if (!sharedAudioCtx) return;

                if (sharedAudioCtx.state === 'suspended') {
                    sharedAudioCtx.resume();
                }

                const playNote = (freq, startTime, duration) => {
                    const osc = sharedAudioCtx.createOscillator();
                    const gain = sharedAudioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, startTime);

                    gain.gain.setValueAtTime(0.001, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.42, startTime + 0.025);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

                    osc.connect(gain);
                    gain.connect(sharedAudioCtx.destination);

                    osc.start(startTime);
                    osc.stop(startTime + duration + 0.02);
                };

                const now = sharedAudioCtx.currentTime;
                playNote(880.00, now, 0.24);        // A5
                playNote(1174.66, now + 0.22, 0.34); // D6

                if (navigator.vibrate) {
                    navigator.vibrate([120, 70, 120]);
                }
            } catch (e) {
                console.warn('Ошибка воспроизведения звука:', e);
            }
        }

        /**
         * Управление Screen Wake Lock API (экран не гаснет во время обратного отсчёта)
         */
        function setWakeLockIndicator(active) {
            const badge = document.getElementById('wakelock-badge');
            if (!badge) return;
            if (active) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        async function requestWakeLock() {
            if (!('wakeLock' in navigator)) return;
            try {
                if (wakeLockSentinel !== null) return;
                wakeLockSentinel = await navigator.wakeLock.request('screen');
                setWakeLockIndicator(true);
                wakeLockSentinel.addEventListener('release', () => {
                    wakeLockSentinel = null;
                    setWakeLockIndicator(false);
                });
            } catch (e) {
                setWakeLockIndicator(false);
            }
        }

        async function releaseWakeLock() {
            if (wakeLockSentinel !== null) {
                try {
                    await wakeLockSentinel.release();
                } catch (e) {
                    // Игнорируем ошибку при уже освобождённом замке
                } finally {
                    wakeLockSentinel = null;
                    setWakeLockIndicator(false);
                }
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                unlockIosAudio();
                if (timerState.isRunning) {
                    requestWakeLock();
                    syncRunningTimer();
                }
            }
        });

        /**
         * Всплывающее уведомление (Toast)
         */
        function showToast(message, accent = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-medium shadow-lg transition-all duration-300 opacity-0 translate-y-[-8px] text-center border';

            if (accent) {

                toast.style.borderColor = 'var(--accent-emerald)';
                toast.style.color = '#FFFFFF';
            } else {
                toast.style.backgroundColor = 'var(--bg-card)';
                toast.style.borderColor = 'var(--border-subtle)';
                toast.style.color = 'var(--text-primary)';
            }

            toast.textContent = message;
            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('opacity-0', 'translate-y-[-8px]');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-8px]');
                setTimeout(() => toast.remove(), 300);
            }, 2600);
        }

        /**
         * Подсчёт прогресса подходов дня
         */
        function getDayStats(day) {
            let totalSets = 0;
            let doneSets = 0;

            day.exercises.forEach(ex => {
                totalSets += ex.sets;
                const arr = state.completedSets[ex.id] || [];
                for (let i = 0; i < ex.sets; i++) {
                    if (arr[i]) doneSets++;
                }
            });

            const percent = totalSets > 0 ? Math.round((doneSets / totalSets) * 100) : 0;
            return { totalSets, doneSets, percent };
        }

                        <button type="button"
                            class="tip-toggle tactile-btn w-8 h-8 rounded-xl flex items-center justify-center text-secondary hover:text-primary shrink-0"
                            style="background-color: ${isTipOpen ? 'var(--accent-blue-soft)' : 'var(--bg-pill)'}; color: ${isTipOpen ? 'var(--accent-blue)' : 'var(--text-secondary)'};"
                            title="Техника выполнения"
                            aria-expanded="${isTipOpen}">
                            <svg class="w-4 h-4 transition-transform duration-200 ${isTipOpen ? 'rotate-180' : ''}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </button>
                    </div>

                    <!-- Плавный аккордеон подсказки по технике -->
                    <div class="tip-accordion ${isTipOpen ? 'open' : ''}">
                        <div class="tip-accordion-inner">
                            <div class="p-3 rounded-2xl text-xs text-secondary leading-relaxed border"
                                style="background-color: var(--bg-pill); border-color: var(--border-subtle);">
                                <span class="font-semibold text-primary">Техника: </span>${ex.tip}
                            </div>
                        </div>
                    </div>

                    <!-- Сетка тактильных кнопок подходов -->
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-3.5">
                        ${setsHtml}
                    </div>
                `;

                // Переключение аккордеона подсказки
                const tipToggle = card.querySelector('.tip-toggle');
                const tipAccordion = card.querySelector('.tip-accordion');
                const chevron = tipToggle.querySelector('svg');
                tipToggle.addEventListener('click', () => {
                    const nextOpen = !state.openTips[ex.id];
                    state.openTips[ex.id] = nextOpen;
                    saveState();
                    tipAccordion.classList.toggle('open', nextOpen);
                    chevron.classList.toggle('rotate-180', nextOpen);
                    tipToggle.setAttribute('aria-expanded', String(nextOpen));
                    tipToggle.style.backgroundColor = nextOpen ? 'var(--accent-blue-soft)' : 'var(--bg-pill)';
                    tipToggle.style.color = nextOpen ? 'var(--accent-blue)' : 'var(--text-secondary)';
                });

                // Быстрый запуск таймера по нажатию на «Отдых: N сек»
                card.querySelector('.quick-rest-trigger').addEventListener('click', () => {
                    unlockIosAudio();
                    startRestTimer(ex.restSec, ex.name, true);
                });

                // Обработка нажатий на подходы
                card.querySelectorAll('.set-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        unlockIosAudio();
                        const exId = btn.dataset.exId;
                        const setIdx = parseInt(btn.dataset.setIdx, 10);
                        const restSec = parseInt(btn.dataset.rest, 10);
                        const exName = btn.dataset.exName;

                        if (!state.completedSets[exId]) {
                            state.completedSets[exId] = Array(ex.sets).fill(false);
                        }

                        const wasChecked = state.completedSets[exId][setIdx];
                        state.completedSets[exId][setIdx] = !wasChecked;
                        saveState();
                        renderDayTabs();
                        renderActiveDay();

                        if (!wasChecked) {
                            startRestTimer(restSec, exName, state.settings.autoStartTimer);
                        }
                    });
                });

                listEl.appendChild(card);
            });
        }

        /**
         * Отрисовка журнала завершённых тренировок
         */
        function renderHistory() {
            const listEl = document.getElementById('history-list');
            const clearBtn = document.getElementById('btn-clear-history');

            if (!state.history || state.history.length === 0) {
                clearBtn.classList.add('hidden');
                listEl.innerHTML = `
                    <p class="text-xs text-secondary py-1">
                        Пока нет записей. После выполнения подходов нажмите «Завершить и записать тренировку».
                    </p>
                `;
                return;
            }

            clearBtn.classList.remove('hidden');
            listEl.innerHTML = state.history.slice(0, 12).map(item => `
                <div class="flex items-center justify-between gap-3 py-2.5 px-3 rounded-2xl text-xs"
                    style="background-color: var(--bg-pill);">
                    <div class="flex items-center gap-2 min-w-0">
                        <span class="w-2 h-2 rounded-full shrink-0" style="background-color: var(--accent-emerald);"></span>
                        <span class="font-medium text-primary truncate">${item.dayTitle}</span>
                    </div>
                    <div class="flex items-center gap-3 shrink-0 text-secondary timer-digits">
                        <span>${item.setsCount}</span>
                        <span>${item.dateStr}</span>
                    </div>
                </div>
            `).join('');
        }

        /**
         * Форматирование времени (MM:SS)
         */
        function formatSeconds(sec) {
            const clamped = Math.max(0, Math.ceil(sec));
            const m = Math.floor(clamped / 60);
            const s = clamped % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        /**
         * Обновление UI парящего таймера отдыха
         */
        function updateTimerUI() {
            document.getElementById('timer-display').textContent = formatSeconds(timerState.remaining);
            document.getElementById('timer-label').textContent = timerState.label || 'Отдых';

            const toggleBtn = document.getElementById('timer-toggle');
            const toggleText = document.getElementById('timer-toggle-text');
            const progressBar = document.getElementById('timer-progress-bar');

            if (timerState.isRunning) {
                toggleText.textContent = 'Пауза';
                toggleBtn.style.backgroundColor = '#D97706'; // Спокойный янтарный для паузы
                progressBar.style.backgroundColor = 'var(--accent-blue)';
            } else {
                toggleText.textContent = 'Старт';
                toggleBtn.style.backgroundColor = 'var(--accent-blue)';
                progressBar.style.backgroundColor = timerState.remaining === 0 ? 'var(--accent-emerald)' : 'var(--accent-blue)';
            }

            const pct = timerState.duration > 0
                ? Math.min(100, Math.max(0, (timerState.remaining / timerState.duration) * 100))
                : 0;
            progressBar.style.width = `${pct}%`;

            // Подсветка активного пресета
            document.querySelectorAll('.timer-preset').forEach(btn => {
                const presetVal = parseInt(btn.dataset.preset, 10);
                if (presetVal === timerState.duration) {
                    btn.style.backgroundColor = 'var(--accent-blue-soft)';
                    btn.style.color = 'var(--accent-blue)';
                    btn.style.fontWeight = '600';
                } else {
                    btn.style.backgroundColor = 'var(--bg-pill)';
                    btn.style.color = 'var(--text-secondary)';
                    btn.style.fontWeight = '500';
                }
            });
        }

        function stopTimerInterval() {
            if (timerState.intervalId) {
                clearInterval(timerState.intervalId);
                timerState.intervalId = null;
            }
            timerState.isRunning = false;
            timerState.endTime = null;
            releaseWakeLock();
        }

        function handleTimerCompleted() {
            timerState.remaining = 0;
            stopTimerInterval();
            updateTimerUI();
            playTimerChime();

            const dock = document.getElementById('timer-dock');
            dock.classList.remove('dock-finished');
            void dock.offsetWidth;
            dock.classList.add('dock-finished');
            showToast('Отдых завершён — пора к подходу!', true);
        }

        function syncRunningTimer() {
            if (!timerState.isRunning || !timerState.endTime) return;
            const left = (timerState.endTime - Date.now()) / 1000;
            if (left <= 0) {
                handleTimerCompleted();
            } else {
                timerState.remaining = Math.ceil(left);
                updateTimerUI();
            }
        }

        function startRestTimer(seconds, label = 'Отдых', autoRun = true) {
            stopTimerInterval();
            timerState.duration = seconds;
            timerState.remaining = seconds;
            timerState.label = label.split('(')[0].trim();

            const dock = document.getElementById('timer-dock');
            dock.classList.remove('dock-finished');

            if (autoRun) {
                resumeTimer();
            } else {
                updateTimerUI();
            }
        }

        function resumeTimer() {
            if (timerState.isRunning) return;
            unlockIosAudio();

            if (timerState.remaining <= 0) {
                timerState.remaining = timerState.duration;
            }

            timerState.isRunning = true;
            timerState.endTime = Date.now() + timerState.remaining * 1000;
            requestWakeLock();
            updateTimerUI();

            timerState.intervalId = setInterval(syncRunningTimer, 250);
        }

        function renderAll() {
            applyThemeAndSettings();
            renderDayTabs();
            renderActiveDay();
            renderHistory();
            updateTimerUI();
        }

        /**
         * Привязка событий интерфейса
         */
        function bindEvents() {
            // Смена светлой / тёмной темы
            document.getElementById('toggle-theme').addEventListener('click', () => {
                state.settings.darkMode = !state.settings.darkMode;
                saveState();
                applyThemeAndSettings();
            });

            // Авто-таймер при отметке подхода
            document.getElementById('toggle-autostart').addEventListener('click', () => {
                state.settings.autoStartTimer = !state.settings.autoStartTimer;
                saveState();
                applyThemeAndSettings();
                showToast(state.settings.autoStartTimer
                    ? 'Автозапуск таймера включён'
                    : 'Автозапуск таймера выключен');
            });

            // Проверка звука на iPhone
            document.getElementById('btn-test-sound').addEventListener('click', () => {
                unlockIosAudio();
                playTimerChime();
                showToast('Сигнал отправлен (проверьте переключатель звука на iPhone)');
            });

            // Старт / Пауза таймера
            document.getElementById('timer-toggle').addEventListener('click', () => {
                unlockIosAudio();
                if (timerState.isRunning) {
                    syncRunningTimer();
                    stopTimerInterval();
                    updateTimerUI();
                } else {
                    resumeTimer();
                }
            });

            // Сброс таймера
            document.getElementById('timer-reset').addEventListener('click', () => {
                stopTimerInterval();
                timerState.remaining = timerState.duration;
                updateTimerUI();
            });

            // −15с и +15с
            document.getElementById('timer-minus').addEventListener('click', () => {
                unlockIosAudio();
                timerState.remaining = Math.max(5, timerState.remaining - 15);
                if (timerState.isRunning) {
                    timerState.endTime = Date.now() + timerState.remaining * 1000;
                }
                if (timerState.remaining > timerState.duration) {
                    timerState.duration = timerState.remaining;
                }
                updateTimerUI();
            });

            document.getElementById('timer-plus').addEventListener('click', () => {
                unlockIosAudio();
                timerState.remaining += 15;
                if (timerState.isRunning) {
                    timerState.endTime = Date.now() + timerState.remaining * 1000;
                }
                if (timerState.remaining > timerState.duration) {
                    timerState.duration = timerState.remaining;
                }
                updateTimerUI();
            });

            // Пресеты (60с, 90с, 120с, 150с)
            document.querySelectorAll('.timer-preset').forEach(btn => {
                btn.addEventListener('click', () => {
                    unlockIosAudio();
                    const sec = parseInt(btn.dataset.preset, 10);
                    startRestTimer(sec, `Отдых (${sec} сек)`, true);
                });
            });

            // Завершить и записать тренировку
            document.getElementById('btn-finish-workout').addEventListener('click', () => {
                const day = WORKOUT_PLAN.find(d => d.id === state.activeDayId) || WORKOUT_PLAN[0];
                const stats = getDayStats(day);

                if (stats.doneSets === 0) {
                    showToast('Отметьте хотя бы один подход перед завершением.');
                    return;
                }

                const now = new Date();
                const dateStr = now.toLocaleDateString('ru-RU', {
                    day: '2-digit',
                    month: 'short',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                state.completedDays[day.id] = true;
                state.history.unshift({
                    id: Date.now(),
                    dayId: day.id,
                    dayTitle: `${day.shortTitle}: ${day.focus}`,
                    dateStr,
                    setsCount: `${stats.doneSets}/${stats.totalSets}`
                });

                saveState();
                renderDayTabs();
                renderHistory();
                showToast(`Тренировка «${day.shortTitle}» записана в историю!`, true);
            });

            // Сбросить подходы текущего дня
            document.getElementById('btn-reset-day').addEventListener('click', () => {
                const day = WORKOUT_PLAN.find(d => d.id === state.activeDayId) || WORKOUT_PLAN[0];
                showConfirmModal(
                    `Сбросить ${day.shortTitle}?`,
                    'Все отметки подходов для этого дня будут очищены, чтобы начать новый тренировочный круг.',
                    () => {
                        day.exercises.forEach(ex => {
                            delete state.completedSets[ex.id];
                        });
                        delete state.completedDays[day.id];
                        saveState();
                        renderDayTabs();
                        renderActiveDay();
                        showToast(`Отметки для «${day.shortTitle}» сброшены`);
                    }
                );
            });

            // Очистить историю тренировок
            document.getElementById('btn-clear-history').addEventListener('click', () => {
                showConfirmModal(
                    'Очистить историю?',
                    'Все записи о завершённых тренировках будут удалены.',
                    () => {
                        state.history = [];
                        saveState();
                        renderHistory();
                        showToast('История тренировок очищена');
                    }
                );
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            bindEvents();
            renderAll();
        });
    </script>
</body>
</html>
